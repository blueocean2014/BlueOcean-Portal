<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlueOcean 音声入力支援経過</title>
<style>
body{margin:0;background:#f4f7fb;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}
header{background:#0b5cab;color:white;padding:16px} main{max-width:900px;margin:auto;padding:12px}
.card{background:white;padding:15px;margin:12px 0;border-radius:14px;box-shadow:0 2px 8px #0001}
h1{font-size:21px;margin:0}h2{font-size:18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
label{border:1px solid #ccd5df;border-radius:9px;padding:10px;display:flex;gap:8px;align-items:center}
input[type=checkbox]{width:20px;height:20px}
textarea{width:100%;box-sizing:border-box;border:1px solid #ccd5df;border-radius:9px;padding:11px;font-size:16px;line-height:1.6;min-height:180px}
button{border:0;border-radius:9px;background:#0b5cab;color:white;padding:12px 15px;font-size:15px;margin:4px 2px}
.gray{background:#64748b}.green{background:#16803c}.orange{background:#c2410c}
.status{background:#eef4ff;padding:9px;border-radius:8px;font-size:13px;margin-top:7px}
@media(max-width:600px){.grid{grid-template-columns:1fr}button{width:100%;margin:4px 0}}
</style>
</head>
<body>
<header><h1>BlueOcean　音声入力支援経過</h1>
<div>区分を複数選択 → 音声・手入力 → AI処理用にコピー → 完成記録を貼り付け</div></header>
<main>

<section class="card">
<h2>① 区分を選択</h2>
<div id="cats" class="grid"></div>
<button class="gray" onclick="allOn()">すべて選択</button>
<button class="gray" onclick="allOff()">選択解除</button>
<div id="sel" class="status">未選択</div>
</section>

<section class="card">
<h2>② 音声入力・手入力</h2>
<button onclick="voice()">🎙 音声入力開始</button>
<button class="orange" onclick="stopVoice()">■ 停止</button>
<textarea id="memo" placeholder="訪問時の状況、本人・家族の発言、生活状況、連絡内容などを話すか入力してください。"></textarea>
<div id="vs" class="status">待機中</div>
</section>

<section class="card">
<h2>③ AI処理用にコピー</h2>
<p>コピー後、ChatGPT・Gemini・Claudeなど利用するAIへ貼り付けてください。</p>
<button onclick="copyAI()">AI処理用にコピー</button>
<div id="cs" class="status">未コピー</div>
</section>

<section class="card">
<h2>④ 完成した記録を貼り付け</h2>
<textarea id="result" style="min-height:260px" placeholder="AIが作成した完成記録をここへ貼り付けます。"></textarea>
<button class="green" onclick="copyResult()">⑤ 全文コピー</button>
<div id="rs" class="status">完成記録を貼り付けてからコピーしてください。</div>
</section>

</main>
<script>
const T={
"自宅訪問":"区分：自宅訪問 本人 家族",
"利用票交付":"【利用票交付】\n次月の予定について説明し同意頂き交付",
"モニタリング":"【モニタリング】\n利用者の状態及びサービスの実施状況について確認しモニタリング実施、",
"アセスメント":"【アセスメント実施】\nケアプラン原案作成のためのアセスメントを実施する。※アセスメントシート参照",
"サービス担当者会議":"【サービス担当者会議】更新・区分変更・サービス変更\nサービス担当者会議を実施し、利用者の状況や生活課題等について共有した。ケアプラン原案について各サービス事業所より意見を聴取し調整。利用者・家族へ内容を説明し、同意・署名をいただきケアプランを交付した。\n各サービス事業所にもケアプランを交付し、個別援助計画書の作成・提出を依頼し、了承を得た。\n主治医へもケアプランを送付し医療連携を継続。\nインフォーマルサービスの活用について検討したが、現時点では必要性は低いと判断した。また、福祉用具の必要性についても合わせて情報共有を行い、今後の必要性や導入に向けて検討を継続することとした。",
"長期目標更新":"【長期目標更新 】\nケアプラン長期目標の満了に伴い利用者及び家族、各サービス提供事業所に現在の状況を確認。身体状況や現在の課題等に変更がなく、目標内容も変更の必要性がないため、現状や今後のケア方針を踏まえ、長期目標を延長することが適切であると判断した。\n利用者・家族へ説明し同意署名を頂きケアプラン交付。\nサービス事業所に照会、情報提供（ケアプラン交付）、個別援助計画書の作成・交付依頼。主治医に情報提供（ケアプラン送付）し医療連携を継続。",
"短期目標更新":"【短期目標更新】\n短期目標更新時期にてプラン継続についてご本人、ご家族、各サービス事業所に確認。状態も安定している為短期目標については長期目標期間内で更新することとする。各サービス事業所に目標の更新について伝達。軽微変更",
"連絡調整":"連絡調整：入力内容を簡潔に整理する。",
"新規依頼・契約":"新規依頼情報提供実施。",
"初回面談":"【初回面談】\nインテーク面接とアセスメントを行い、希望・身体状況・介護力・生活環境を確認。",
"入院時情報連携加算（Ⅰ）":"【入院時情報連携加算（Ⅰ）※電話・ＦＡＸによる情報提供】\n病院地域連携室〇〇氏に電話・ＦＡＸし、入院時情報提供を行う。提供した情報は別紙参照。",
"時間外入院時情報提供（Ⅰ）":"【入院時情報連携加算（Ⅰ）※電話・ＦＡＸによる情報提供】\n入院・入院連絡が営業時間外であったため、翌営業日の情報提供。\n病院地域連携室〇〇氏に電話・ＦＡＸし、入院時情報提供を行う。提供した情報は別紙参照。",
"入院時情報連携加算（Ⅱ）":"【入院時情報連携加算（Ⅱ）※電話・ＦＡＸによる情報提供】\n病院地域連携室〇〇氏に電話・ＦＡＸし、入院時情報提供を行う。提供した情報は別紙参照。",
"退院・退所加算（面談・サマリーあり）":"〇〇病院の地域連携室・看護師・医師〇〇氏と面談し、退院後の在宅生活に必要な情報提供を受ける。※具体的内容はサマリー・退院・退所情報記録書参照。",
"退院・退所加算（面談・サマリーなし）":"〇〇病院の地域連携室・看護師・医師××氏と面談し、退院後の在宅生活に必要な情報提供を受ける。",
"退院・退所加算（会議開催・カンファなし）":"〇〇病院にて退院前会議開催、退院後の在宅生活に必要な情報提供を受ける。※具体的内容は病院からの情報提供書・退所情報記録書・要点参照。",
"退院・退所加算（カンファレンス開催）":"〇〇病院にて退院前カンファレンス開催、退院後の在宅生活に必要な情報提供を受ける。※具体的内容は病院からの情報提供書・退所情報記録書・要点参照。",
"カンファレンス":"【カンファレンス開催】\n病状・ADL・リハビリ状況・退院後の生活課題等を共有し、在宅生活に向けた支援方針と今後の方向性を確認。",
"サービス利用割合の説明":"【サービス利用割合の説明】\n居宅介護支援のサービス利用割合について説明。",
"契約":"【契約について】\n契約書・重要事項説明書を説明し、同意署名取得後交付。居宅サービス計画作成依頼届に署名を得て、介護保険証を預かった。"
};
Object.keys(T).forEach(k=>{cats.innerHTML+=`<label><input type="checkbox" value="${k}" onchange="update()"> ${k}</label>`});
function selected(){return [...document.querySelectorAll('#cats input:checked')].map(x=>x.value)}
function update(){let a=selected();sel.textContent=a.length?"選択中："+a.join("、"):"未選択"}
function allOn(){document.querySelectorAll('#cats input').forEach(x=>x.checked=true);update()}
function allOff(){document.querySelectorAll('#cats input').forEach(x=>x.checked=false);update()}

let rec;
function voice(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){vs.textContent="このブラウザでは音声入力が利用できません。手入力してください。";return}
 rec=new SR();rec.lang="ja-JP";rec.continuous=true;rec.interimResults=false;
 rec.onstart=()=>vs.textContent="🎙 音声入力中…";
 rec.onresult=e=>{let s="";for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)s+=e.results[i][0].transcript;if(s)memo.value+=(memo.value?"\n":"")+s};
 rec.onerror=e=>vs.textContent="音声入力エラー："+e.error;
 rec.onend=()=>vs.textContent="待機中";
 rec.start()
}
function stopVoice(){if(rec){rec.stop();rec=null}vs.textContent="音声入力停止"}

const RULE=`【支援経過作成ルール】
区分：入力した区分と同一語句を記載。自宅訪問は「自宅訪問 本人 家族」。複数選択時はすべて反映。
内容：定型文はそのまま挿入。連絡調整は自由記載。介護支援専門員の支援経過記録として自然で読みやすく、報告書のような硬い表現にしない。訪問時の状況、会話内容、生活状況を事実ベースで記載。感情や印象を補足しない。
関係機関・介護支援専門員の判断：入力情報をもとにケアマネジャーとして行ったこと・判断を「〇〇した。〇〇する。」で記載。「確認した」を多用しない。内容と重複する事項は記載しない。短期目標更新はこの欄のみ。
利用者・家族の考え方：本人は「本人：」、家族は「家族：」で自然な話し言葉として記載。「と話す」「とのこと」「との話あり」「と言われる」は禁止。意見がなければ記載しない。
出力項目：区分／内容／関係機関・介護支援専門員の判断／利用者・家族の考え方`;

function copyAI(){
 let a=selected(),m=memo.value.trim();
 if(!a.length){cs.textContent="区分を選択してください。";return}
 if(!m){cs.textContent="音声・手入力の内容を入力してください。";return}
 let text=`あなたは介護支援専門員です。以下の情報から支援経過を作成してください。

【選択区分】
${a.join("、")}

【定型文】
${a.map(x=>T[x]).join("\n\n")}

【音声・手入力記録】
${m}

${RULE}
選択したすべての区分を反映してください。定型文は原則そのまま使用し、入力内容を自然に追記・整理してください。`;
 navigator.clipboard.writeText(text).then(()=>cs.textContent="AI処理用データをコピーしました。").catch(()=>fallback(text,cs))
}
function fallback(text,el){let t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();el.textContent="AI処理用データをコピーしました。"}
function copyResult(){
 let x=result.value.trim();if(!x){rs.textContent="完成記録を貼り付けてください。";return}
 navigator.clipboard.writeText(x).then(()=>rs.textContent="全文をコピーしました。Google Keep・カイポケ等へ貼り付けできます。").catch(()=>fallback(x,rs))
}
</script>
</body>
</html>
