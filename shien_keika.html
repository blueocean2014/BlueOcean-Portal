<style>

body{

}

header{

h2{

}

  display:grid;

}

label{
  border:1px solid #ccd5df;
  border-radius:9px;
  padding:10px;
  display:flex;
  gap:8px;
  align-items:center;
  background:white;
  cursor:pointer;
}

label:hover{
  background:#f1f6ff;
}

input[type=checkbox]{
  width:20px;
  height:20px;
  flex-shrink:0;
}

textarea{
  width:100%;
  box-sizing:border-box;
  border:1px solid #ccd5df;
  border-radius:9px;
  padding:11px;
  font-size:16px;
  line-height:1.6;
  min-height:220px;
  resize:vertical;
}

button{
  border:0;
  border-radius:9px;
  background:#0b5cab;
  color:white;
  padding:12px 15px;
  font-size:15px;
  margin:4px 2px;
  cursor:pointer;
}

button:hover{
  opacity:0.9;
}

.gray{
  background:#64748b;
}

.status{
  background:#eef4ff;
  padding:9px;
  border-radius:8px;
  font-size:13px;
  margin-top:7px;
  white-space:pre-wrap;
}

.description{
  font-size:14px;
  line-height:1.6;
  color:#444;
}

  .grid{
    grid-template-columns:1fr;
  }

  button{
    width:100%;
    margin:4px 0;
  }

</head>


<body>


<header>

<h1>BlueOcean　音声入力支援経過</h1>

<div>
区分を選択 → 音声・手入力 → AI処理用にコピー
</div>

</header>


<main>


<!-- =====================================================
     ① 区分を選択
===================================================== -->

<section class="card">

<h2>① 区分を選択</h2>

<div id="cats" class="grid"></div>

<button class="gray" onclick="allOn()">
すべて選択
</button>

<button class="gray" onclick="allOff()">
選択解除
</button>

<div id="sel" class="status">
未選択
</div>

</section>


<!-- =====================================================
     ② 音声・手入力
===================================================== -->

<section class="card">

<h2>② 音声・手入力</h2>

<p class="description">

訪問時の状況、本人・家族の発言、生活状況、
サービス利用状況、連絡内容などを入力してください。

<br>

<strong>
Windowsの場合は「Windowsキー＋H」で音声入力できます。
</strong>

<br>

入力がない場合でも、区分を選択するだけで定型文による支援経過を作成できます。

</p>

<textarea
id="memo"
placeholder="ここに話した内容や支援経過に残したい内容を入力してください。入力しなくても構いません。"
></textarea>

</section>


<!-- =====================================================
     ③ AI処理用にコピー
===================================================== -->

<section class="card">

<h2>③ AI処理用にコピー</h2>

<p class="description">

「AI処理用にコピー」を押して、利用するAIへ貼り付けてください。

<br>

音声・手入力がなくても、選択した区分の定型文だけで処理できます。

</p>

<button onclick="copyAI()">
AI処理用にコピー
</button>

<div id="cs" class="status">
未コピー
</div>

</section>


</main>

===================================================== */

Object.keys(T).forEach(function(key){

const label =
document.createElement("label");

const checkbox =
document.createElement("input");

checkbox.type =
"checkbox";

checkbox.value =
key;

checkbox.addEventListener(
"change",
update
);

label.appendChild(
checkbox
);

label.appendChild(
document.createTextNode(" " + key)
);

catsElement.appendChild(
label
);

});


/* =====================================================
   選択区分取得
===================================================== */

function selected(){

return Array.from(
catsElement.querySelectorAll(
'input[type="checkbox"]:checked'
)
).map(function(x){

return x.value;

});

}


/* =====================================================
   区分表示
===================================================== */

function update(){

const a =
selected();

if(!a.length){

selElement.textContent =
"未選択";

return;

}

let text = "";

a.forEach(function(x){

if(x === "自宅訪問"){

text +=
"自宅訪問\n本人\n家族\n";

}else{

text +=
x + "\n";

}

});

selElement.textContent =
"選択中：\n" + text.trim();

}


/* =====================================================
   すべて選択
===================================================== */

function allOn(){

catsElement
.querySelectorAll(
'input[type="checkbox"]'
)
.forEach(function(x){

x.checked =
true;

});

update();

}


/* =====================================================
   選択解除
===================================================== */

function allOff(){

catsElement
.querySelectorAll(
'input[type="checkbox"]'
)
.forEach(function(x){

x.checked =
false;

});

update();

}

/* =====================================================
   コピー処理
===================================================== */

function copyText(
text,
element,
successMessage
){

if(
navigator.clipboard &&
window.isSecureContext
){

navigator.clipboard.writeText(text)
.then(function(){

element.textContent =
successMessage;

})
.catch(function(){

fallbackCopy(
text,
element,
successMessage
);

});

}else{

fallbackCopy(
text,
element,
successMessage
);

}

}


/* =====================================================
   古いブラウザ用コピー
===================================================== */

function fallbackCopy(
text,
element,
successMessage
){

const temporary =
document.createElement("textarea");

temporary.value =
text;

temporary.style.position =
"fixed";

temporary.style.left =
"-9999px";

temporary.style.top =
"-9999px";

document.body.appendChild(
temporary
);

temporary.focus();

temporary.select();

try{

const success =
document.execCommand("copy");

if(success){

element.textContent =
successMessage;

}else{

element.textContent =
"コピーできませんでした。手動でコピーしてください。";

}

}catch(error){

element.textContent =
"コピーできませんでした。手動でコピーしてください。";

}

document.body.removeChild(
temporary
);

}
