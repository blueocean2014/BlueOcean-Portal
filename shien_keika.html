<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlueOcean 音声入力支援経過</title>

<style>

body{
  margin:0;
  background:#f4f7fb;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;
}

header{
  background:#0b5cab;
  color:white;
  padding:16px;
}

main{
  max-width:900px;
  margin:auto;
  padding:12px;
}

.card{
  background:white;
  padding:15px;
  margin:12px 0;
  border-radius:14px;
  box-shadow:0 2px 8px #0001;
}

h1{
  font-size:21px;
  margin:0;
}

h2{
  font-size:18px;
  margin-top:0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

label{
  border:1px solid #ccd5df;
  border-radius:9px;
  padding:10px;
  display:flex;
  gap:8px;
  align-items:center;
  background:white;
  cursor:pointer;
}

label:hover{
  background:#f1f6ff;
}

input[type=checkbox]{
  width:20px;
  height:20px;
}

textarea{
  width:100%;
  box-sizing:border-box;
  border:1px solid #ccd5df;
  border-radius:9px;
  padding:11px;
  font-size:16px;
  line-height:1.6;
  min-height:220px;
  resize:vertical;
}

button{
  border:0;
  border-radius:9px;
  background:#0b5cab;
  color:white;
  padding:12px 15px;
  font-size:15px;
  margin:4px 2px;
  cursor:pointer;
}

button:hover{
  opacity:0.9;
}

.gray{
  background:#64748b;
}

.status{
  background:#eef4ff;
  padding:9px;
  border-radius:8px;
  font-size:13px;
  margin-top:7px;
  white-space:pre-wrap;
}

.description{
  font-size:14px;
  line-height:1.6;
  color:#444;
}

@media(max-width:600px){

  .grid{
    grid-template-columns:1fr;
  }

  button{
    width:100%;
    margin:4px 0;
  }

}

</style>
</head>

<body>

<header>

<h1>BlueOcean　音声入力支援経過</h1>

<div>
区分を選択 → 音声・手入力 → AI処理用にコピー
</div>

</header>

<main>

<!-- =====================================================
     ① 区分を選択
===================================================== -->

<section class="card">

<h2>① 区分を選択</h2>

<div id="cats" class="grid"></div>

<button class="gray" onclick="allOn()">
すべて選択
</button>

<button class="gray" onclick="allOff()">
選択解除
</button>

<div id="sel" class="status">
未選択
</div>

</section>


<!-- =====================================================
     ② 音声・手入力
===================================================== -->

<section class="card">

<h2>② 音声・手入力</h2>

<p class="description">

訪問時の状況、本人・家族の発言、生活状況、
サービス利用状況、連絡内容などを入力してください。

<br>

<strong>
Windowsの場合は「Windowsキー＋H」で音声入力できます。
</strong>

</p>

<textarea
id="memo"
placeholder="ここに話した内容や支援経過に残したい内容を入力してください。"
></textarea>

</section>


<!-- =====================================================
     ③ AI処理用にコピー
===================================================== -->

<section class="card">

<h2>③ AI処理用にコピー</h2>

<p class="description">

「AI処理用にコピー」を押して、使用するAIへ貼り付けてください。
ChatGPT、Gemini、Claudeなど、特定のAIに限定しません。

</p>

<button onclick="copyAI()">
AI処理用にコピー
</button>

<div id="cs" class="status">
未コピー
</div>

</section>

</main>


<script>


/* =====================================================
   HTML要素
===================================================== */

const catsElement =
document.getElementById("cats");

const selElement =
document.getElementById("sel");

const memoElement =
document.getElementById("memo");

const csElement =
document.getElementById("cs");


/* =====================================================
   定型文
===================================================== */

const T = {


"自宅訪問":
"区分：自宅訪問 本人 家族",


"利用票交付":
"【利用票交付】\n次月の予定について説明し同意頂き交付",


"モニタリング":
"【モニタリング】\n利用者の状態及びサービスの実施状況について確認しモニタリング実施、",


"アセスメント":
"【アセスメント実施】\nケアプラン原案作成のためのアセスメントを実施する。※アセスメントシート参照",


"サービス担当者会議":
"【サービス担当者会議】更新・区分変更・サービス変更\nサービス担当者会議を実施し、利用者の状況や生活課題等について共有した。ケアプラン原案について各サービス事業所より意見を聴取し調整。利用者・家族へ内容を説明し、同意・署名をいただきケアプランを交付した。\n各サービス事業所にもケアプランを交付し、個別援助計画書の作成・提出を依頼し、了承を得た。\n主治医へもケアプランを送付し医療連携を継続。\nインフォーマルサービスの活用について検討したが、現時点では必要性は低いと判断した。また、福祉用具の必要性についても合わせて情報共有を行い、今後の必要性や導入に向けて検討を継続することとした。",


"長期目標更新":
"【長期目標更新 】\nケアプラン長期目標の満了に伴い利用者及び家族、各サービス提供事業所に現在の状況を確認。身体状況や現在の課題等に変更がなく、目標内容も変更の必要性がないため、現状や今後のケア方針を踏まえ、長期目標を延長することが適切であると判断した。\n利用者・家族へ説明し同意署名を頂きケアプラン交付。\nサービス事業所に照会、情報提供（ケアプラン交付）、個別援助計画書の作成・交付依頼。主治医に情報提供（ケアプラン送付）し医療連携を継続。",


"短期目標更新":
"【短期目標更新】\n短期目標更新時期にてプラン継続についてご本人、ご家族、各サービス事業所に確認。状態も安定している為短期目標については長期目標期間内で更新することとする。各サービス事業所に目標の更新について伝達。軽微変更",


"連絡調整":
"連絡調整：入力内容を簡潔に整理する。",


"新規依頼・契約":
"新規依頼情報提供実施。",


"初回面談":
"【初回面談】\nインテーク面接とアセスメントを行い、希望・身体状況・介護力・生活環境を確認。",


"入院時情報連携加算（Ⅰ）":
"【入院時情報連携加算（Ⅰ）※電話・ＦＡＸによる情報提供】\n病院地域連携室〇〇氏に電話・ＦＡＸし、入院時情報提供を行う。提供した情報は別紙参照。",


"時間外入院時情報提供（Ⅰ）":
"【入院時情報連携加算（Ⅰ）※電話・ＦＡＸによる情報提供】\n入院・入院連絡が営業時間外であったため、翌営業日の情報提供。\n病院地域連携室〇〇氏に電話・ＦＡＸし、入院時情報提供を行う。提供した情報は別紙参照。",


"入院時情報連携加算（Ⅱ）":
"【入院時情報連携加算（Ⅱ）※電話・ＦＡＸによる情報提供】\n病院地域連携室〇〇氏に電話・ＦＡＸし、入院時情報提供を行う。提供した情報は別紙参照。",


"退院・退所加算（面談・サマリーあり）":
"〇〇病院の地域連携室・看護師・医師〇〇氏と面談し、退院後の在宅生活に必要な情報提供を受ける。※具体的内容はサマリー・退院・退所情報記録書参照。",


"退院・退所加算（面談・サマリーなし）":
"〇〇病院の地域連携室・看護師・医師××氏と面談し、退院後の在宅生活に必要な情報提供を受ける。",


"退院・退所加算（会議開催・カンファなし）":
"〇〇病院にて退院前会議開催、退院後の在宅生活に必要な情報提供を受ける。※具体的内容は病院からの情報提供書・退所情報記録書・要点参照。",


"退院・退所加算（カンファレンス開催）":
"〇〇病院にて退院前カンファレンス開催、退院後の在宅生活に必要な情報提供を受ける。※具体的内容は病院からの情報提供書・退所情報記録書・要点参照。",


"カンファレンス":
"【カンファレンス開催】\n病状・ADL・リハビリ状況・退院後の生活課題等を共有し、在宅生活に向けた支援方針と今後の方向性を確認。",


"サービス利用割合の説明":
"【サービス利用割合の説明】\n居宅介護支援のサービス利用割合について説明。",


"契約":
"【契約について】\n契約書・重要事項説明書を説明し、同意署名取得後交付。居宅サービス計画作成依頼届に署名を得て、介護保険証を預かった。"

};


/* =====================================================
   区分を表示
===================================================== */

Object.keys(T).forEach(function(key){

const label =
document.createElement("label");

const checkbox =
document.createElement("input");

checkbox.type =
"checkbox";

checkbox.value =
key;

checkbox.addEventListener(
"change",
update
);

label.appendChild(
checkbox
);

label.appendChild(
document.createTextNode(" " + key)
);

catsElement.appendChild(
label
);

});


/* =====================================================
   選択区分取得
===================================================== */

function selected(){

return Array.from(
catsElement.querySelectorAll(
'input[type="checkbox"]:checked'
)
).map(function(x){

return x.value;

});

}


/* =====================================================
   選択状態表示
===================================================== */

function update(){

const a =
selected();

if(a.length){

selElement.textContent =
"選択中：\n" + a.join("\n");

}else{

selElement.textContent =
"未選択";

}

}


/* =====================================================
   すべて選択
===================================================== */

function allOn(){

catsElement
.querySelectorAll(
'input[type="checkbox"]'
)
.forEach(function(x){

x.checked =
true;

});

update();

}


/* =====================================================
   選択解除
===================================================== */

function allOff(){

catsElement
.querySelectorAll(
'input[type="checkbox"]'
)
.forEach(function(x){

x.checked =
false;

});

update();

}


/* =====================================================
   支援経過作成ルール
===================================================== */

const RULE = `【①区分ルール】

入力語句と同一語句を区分に箇条書で記載する。

【区分出力指定】

各区分の行頭には「・」を付けない。

「自宅訪問」を選択した場合は、

自宅訪問
本人
家族

と改行して記載する。

「自宅訪問 本人 家族」のように1行にはしない。

その他の区分は、入力した語句をそのまま改行して記載する。

【②内容ルール】

定型文があるものはそのまま挿入する。

連絡調整は自由記載とする。

内容の文章は、介護支援専門員の支援経過記録として自然で読みやすい文章に整える。

報告書のような硬い表現にはしない。

訪問時の状況、会話内容、生活状況、サービス利用状況、連絡内容などを事実ベースで記載する。

感情や印象を補足する表現は記載しない。

例：
穏やかに話す
強い様子
落ち着いた様子
などは記載しない。

本人や家族の発言は、その内容を変えず自然な文章にまとめる。

【内容の重要ルール】

「自宅訪問」を選択した場合、
内容欄には「自宅訪問」という文字を記載しない。

自宅訪問の定型文は内容欄には入れず、
入力された訪問時の状況や本人・家族からの相談内容、行った事実などを内容として記載する。

各定型文を記載する場合は、

【利用票交付】
次月の予定について説明し同意頂き交付

のように、
【項目名】
定型文

の順番で記載する。

項目と定型文の間に余分な空行を入れない。

複数の項目を記載する場合も、
項目と項目の間に余分な空行を入れず、そのまま続けて記載する。

【本人・家族からの相談】

本人、家族からの相談内容や、本人・家族に対して行った事実は「内容」に記載する。

【関係機関・介護支援専門員からの相談・判断】

介護支援専門員やサービス事業所等からの相談、連絡、判断、調整内容については「関係機関・介護支援専門員の判断」に記載する。

【短期目標更新】

短期目標更新についての定型文及び判断内容は、
「関係機関・介護支援専門員の判断」にのみ記載する。

内容欄には短期目標更新の定型文を記載しない。

【③関係機関・介護支援専門員の判断】

入力された情報をもとに、
ケアマネジャーとして行ったこと、判断を記載する。

「〇〇した。〇〇する。」
のような具体的な表現にする。

「〇〇を確認した」
という表現を多用しない。

内容に記載した事項と重複する場合は、
内容に記載した事項を優先し、
関係機関・介護支援専門員の判断には重複して記載しない。

入力されていない事実を推測して追加しない。

【④利用者・家族の考え方】

本人・家族の発言内容を参考に、
本人・家族それぞれがその場で話しているような自然な話し言葉でまとめる。

本人の意見は、

本人：

の続きに記載する。

家族の意見は、

家族：

の続きに記載する。

「〜と話す」
「〜とのこと」
「〜との話あり」
「〜と言われる」
「〜との様子」

などの報告調・記録調の表現は禁止する。

本人・家族が実際に話したような表現にする。

例：

本人：今まで通りサービスを利用したい。

家族：今の支援を続けてもらえると助かる。

意見がない場合は空欄でよい。

【⑤重要事項】

定型文は省略しない。

選択された区分に対応する定型文をすべて反映する。

選択されていない区分の定型文は記載しない。

入力されていない情報を推測して追加しない。

支援経過記録として、そのまま記録に貼り付けられる文章にする。`;


/* =====================================================
   AI処理用コピー
===================================================== */

function copyAI(){

const a =
selected();

const m =
memoElement.value.trim();


if(!a.length){

csElement.textContent =
"区分を選択してください。";

return;

}


if(!m){

csElement.textContent =
"音声・手入力の内容を入力してください。";

return;

}


/* =====================================================
   選択区分用データ
===================================================== */

let categoryText = "";

a.forEach(function(x){

if(x === "自宅訪問"){

categoryText +=
"自宅訪問\n本人\n家族\n";

}else{

categoryText +=
x + "\n";

}

});


/* =====================================================
   定型文を区分ごとに整理
===================================================== */

let templateText = "";

a.forEach(function(x){

/*
自宅訪問には定型文を入れない。
内容欄にも「自宅訪問」は記載しない。
*/
if(x === "自宅訪問"){

return;

}


/*
短期目標更新は
「関係機関・介護支援専門員の判断」
のみで使用する。
*/
if(x === "短期目標更新"){

return;

}


/*
連絡調整は入力内容から自由記載するため
固定定型文は使用しない。
*/
if(x === "連絡調整"){

return;

}


/*
新規依頼・契約については
指定された定型文をそのまま使用。
*/
if(x === "新規依頼・契約"){

templateText +=
T[x] + "\n";

return;

}


/*
退院・退所加算については
【】が付いている指定区分と
その定型文をそのまま使用。
*/
templateText +=
T[x] + "\n";

});


/* =====================================================
   AIへ渡す文章
===================================================== */

const text =
`あなたは経験豊富な介護支援専門員です。
以下の情報から、介護支援専門員の支援経過記録を作成してください。

【選択区分】

${categoryText}

【選択された区分に対応する定型文】

${templateText}

【音声・手入力記録】

${m}

${RULE}

【出力形式】

区分：
選択された区分を記載してください。

自宅訪問がある場合は、

自宅訪問
本人
家族

と改行してください。

その他の区分は1項目につき1行で記載してください。

区分の行頭に「・」は付けないでください。


内容：
自宅訪問という文字は記載しないでください。

自宅訪問の場合は、入力された訪問時の状況、本人・家族からの相談内容、行った事実などを記載してください。

定型文がある区分は、

【項目名】
定型文

の形式で記載してください。

項目間に余分な空行を入れず、続けて記載してください。

短期目標更新の定型文は内容には記載せず、
「関係機関・介護支援専門員の判断」のみに記載してください。


関係機関・介護支援専門員の判断：
ケアマネジャーとして行ったこと、判断、関係機関との調整内容を記載してください。

内容と重複する内容は記載しないでください。

短期目標更新を選択している場合は、
短期目標更新に関する内容をこの欄に記載してください。


利用者・家族の考え方：
本人：
家族：

本人・家族の意見がない場合は空欄で構いません。

「と話す」「とのこと」「との話あり」「と言われる」「との様子」は使用しないでください。

本人・家族が実際に話しているような自然な話し言葉で記載してください。

【最終確認】

①選択されたすべての区分を反映する。
②定型文は省略しない。
③自宅訪問は内容欄に記載しない。
④短期目標更新は関係機関・介護支援専門員の判断のみに記載する。
⑤連絡調整は入力内容から自由記載する。
⑥本人・家族の相談内容は内容に記載する。
⑦関係機関・介護支援専門員の判断と内容を重複させない。
⑧入力されていない事実を推測して追加しない。
⑨本人・家族の意見は自然な話し言葉で記載する。
⑩区分の行頭には「・」を付けない。
⑪項目間に余分な空行を入れない。
⑫支援経過記録として、そのまま記録に貼り付けられる形で出力する。`;


copyText(
text,
csElement,
"AI処理用データをコピーしました。使用するAIへ貼り付けてください。"
);

}


/* =====================================================
   コピー処理
===================================================== */

function copyText(
text,
element,
successMessage
){

if(
navigator.clipboard &&
window.isSecureContext
){

navigator.clipboard.writeText(text)
.then(function(){

element.textContent =
successMessage;

})
.catch(function(){

fallbackCopy(
text,
element,
successMessage
);

});

}else{

fallbackCopy(
text,
element,
successMessage
);

}

}


/* =====================================================
   古いブラウザ用コピー
===================================================== */

function fallbackCopy(
text,
element,
successMessage
){

const temporary =
