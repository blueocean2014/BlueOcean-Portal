<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlueOcean 音声入力支援経過</title>

<style>

body{
  margin:0;
  background:#f4f7fb;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;
}

header{
  background:#0b5cab;
  color:white;
  padding:16px;
}

main{
  max-width:900px;
  margin:auto;
  padding:12px;
}

.card{
  background:white;
  padding:15px;
  margin:12px 0;
  border-radius:14px;
  box-shadow:0 2px 8px #0001;
}

h1{
  font-size:21px;
  margin:0;
}

h2{
  font-size:18px;
  margin-top:0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

label{
  border:1px solid #ccd5df;
  border-radius:9px;
  padding:10px;
  display:flex;
  gap:8px;
  align-items:center;
  background:white;
  cursor:pointer;
}

label:hover{
  background:#f1f6ff;
}

input[type=checkbox]{
  width:20px;
  height:20px;
}

textarea{
  width:100%;
  box-sizing:border-box;
  border:1px solid #ccd5df;
  border-radius:9px;
  padding:11px;
  font-size:16px;
  line-height:1.6;
  min-height:220px;
  resize:vertical;
}

button{
  border:0;
  border-radius:9px;
  background:#0b5cab;
  color:white;
  padding:12px 15px;
  font-size:15px;
  margin:4px 2px;
  cursor:pointer;
}

button:hover{
  opacity:0.9;
}

.gray{
  background:#64748b;
}

.status{
  background:#eef4ff;
  padding:9px;
  border-radius:8px;
  font-size:13px;
  margin-top:7px;
  white-space:pre-wrap;
}

.description{
  font-size:14px;
  line-height:1.6;
  color:#444;
}

@media(max-width:600px){

  .grid{
    grid-template-columns:1fr;
  }

  button{
    width:100%;
    margin:4px 0;
  }

}

</style>
</head>


<body>

<header>

<h1>BlueOcean　音声入力支援経過</h1>

<div>
区分を選択 → 音声・手入力 → AI処理用にコピー
</div>

</header>


<main>


<!-- =====================================================
     ① 区分を選択
===================================================== -->

<section class="card">

<h2>① 区分を選択</h2>

<div id="cats" class="grid"></div>

<button class="gray" onclick="allOn()">
すべて選択
</button>

<button class="gray" onclick="allOff()">
選択解除
</button>

<div id="sel" class="status">
未選択
</div>

</section>


<!-- =====================================================
     ② 音声・手入力
===================================================== -->

<section class="card">

<h2>② 音声・手入力</h2>

<p class="description">

訪問時の状況、本人・家族の発言、生活状況、
サービス利用状況、連絡内容などを入力してください。

<br>

<strong>
Windowsの場合は「Windowsキー＋H」で音声入力できます。
</strong>

</p>

<textarea
id="memo"
placeholder="ここに話した内容や支援経過に残したい内容を入力してください。"
></textarea>

</section>


<!-- =====================================================
     ③ AI処理用にコピー
===================================================== -->

<section class="card">

<h2>③ AI処理用にコピー</h2>

<p class="description">

「AI処理用にコピー」を押して、ChatGPT・Gemini・Claudeなど、
使用するAIへ貼り付けてください。

</p>

<button onclick="copyAI()">
AI処理用にコピー
</button>

<div id="cs" class="status">
未コピー
</div>

</section>


</main>


<script>


/* =====================================================
   HTML要素
===================================================== */

const catsElement =
document.getElementById("cats");

const selElement =
document.getElementById("sel");

const memoElement =
document.getElementById("memo");

const csElement =
document.getElementById("cs");


/* =====================================================
   定型文
===================================================== */

const T = {


"自宅訪問":
"",

"利用票交付":
"【利用票交付】\n次月の予定について説明し同意頂き交付",

"モニタリング":
"【モニタリング】\n利用者の状態及びサービスの実施状況について確認しモニタリング実施、",

"アセスメント":
"【アセスメント実施】\nケアプラン原案作成のためのアセスメントを実施する。※アセスメントシート参照",

"サービス担当者会議":
"【サービス担当者会議】更新・区分変更・サービス変更\nサービス担当者会議を実施し、利用者の状況や生活課題等について共有した。ケアプラン原案について各サービス事業所より意見を聴取し調整。利用者・家族へ内容を説明し、同意・署名をいただきケアプランを交付した。\n各サービス事業所にもケアプランを交付し、個別援助計画書の作成・提出を依頼し、了承を得た。\n主治医へもケアプランを送付し医療連携を継続。\nインフォーマルサービスの活用について検討したが、現時点では必要性は低いと判断した。また、福祉用具の必要性についても合わせて情報共有を行い、今後の必要性や導入に向けて検討を継続することとした。",

"長期目標更新":
"【長期目標更新】\nケアプラン長期目標の満了に伴い利用者及び家族、各サービス提供事業所に現在の状況を確認。身体状況や現在の課題等に変更がなく、目標内容も変更の必要性がないため、現状や今後のケア方針を踏まえ、長期目標を延長することが適切であると判断した。\n利用者・家族へ説明し同意署名を頂きケアプラン交付。\nサービス事業所に照会、情報提供（ケアプラン交付）、個別援助計画書の作成・交付依頼。主治医に情報提供（ケアプラン送付）し医療連携を継続。",

"短期目標更新":
"",

"連絡調整":
"",

"新規依頼・契約":
"新規依頼情報提供実施。",

"初回面談":
"【初回面談】\nインテーク面接とアセスメントを行い、希望・身体状況・介護力・生活環境を確認。",

"入院時情報連携加算（Ⅰ）":
"【入院時情報連携加算（Ⅰ）※電話・ＦＡＸによる情報提供】\n病院地域連携室〇〇氏に電話・ＦＡＸし、入院時情報提供を行う。提供した情報は別紙参照。",

"時間外入院時情報提供（Ⅰ）":
"【入院時情報連携加算（Ⅰ）※電話・ＦＡＸによる情報提供】\n入院・入院連絡が営業時間外であったため、翌営業日の情報提供。\n病院地域連携室〇〇氏に電話・ＦＡＸし、入院時情報提供を行う。提供した情報は別紙参照。",

"入院時情報連携加算（Ⅱ）":
"【入院時情報連携加算（Ⅱ）※電話・ＦＡＸによる情報提供】\n病院地域連携室〇〇氏に電話・ＦＡＸし、入院時情報提供を行う。提供した情報は別紙参照。",

"退院・退所加算（面談・サマリーあり）":
"〇〇病院の地域連携室・看護師・医師〇〇氏と面談し、退院後の在宅生活に必要な情報提供を受ける。※具体的内容はサマリー・退院・退所情報記録書参照。",

"退院・退所加算（面談・サマリーなし）":
"〇〇病院の地域連携室・看護師・医師××氏と面談し、退院後の在宅生活に必要な情報提供を受ける。",

"退院・退所加算（会議開催・カンファなし）":
"〇〇病院にて退院前会議開催、退院後の在宅生活に必要な情報提供を受ける。※具体的内容は病院からの情報提供書・退所情報記録書・要点参照。",

"退院・退所加算（カンファレンス開催）":
"〇〇病院にて退院前カンファレンス開催、退院後の在宅生活に必要な情報提供を受ける。※具体的内容は病院からの情報提供書・退所情報記録書・要点参照。",

"カンファレンス":
"【カンファレンス開催】\n病状・ADL・リハビリ状況・退院後の生活課題等を共有し、在宅生活に向けた支援方針と今後の方向性を確認。",

"サービス利用割合の説明":
"【サービス利用割合の説明】\n居宅介護支援のサービス利用割合について説明。",

"契約":
"【契約について】\n契約書・重要事項説明書を説明し、同意署名取得後交付。居宅サービス計画作成依頼届に署名を得て、介護保険証を預かった。"

};


/* =====================================================
   区分を表示
===================================================== */

Object.keys(T).forEach(function(key){

const label =
document.createElement("label");

const checkbox =
document.createElement("input");

checkbox.type =
"checkbox";

checkbox.value =
key;

checkbox.addEventListener(
"change",
update
);

label.appendChild(
checkbox
);

label.appendChild(
document.createTextNode(" " + key)
);

catsElement.appendChild(
label
);

});


/* =====================================================
   選択区分取得
===================================================== */

function selected(){

return Array.from(
catsElement.querySelectorAll(
'input[type="checkbox"]:checked'
)
).map(function(x){

return x.value;

});

}


/* =====================================================
   区分表示
   自宅訪問 → 自宅訪問・本人・家族
   「・」は付けない
===================================================== */

function makeKubunText(){

const a =
selected();

let result = [];

a.forEach(function(item){

if(item === "自宅訪問"){

result.push("自宅訪問");
result.push("本人");
result.push("家族");

}else{

result.push(item);

}

});

return result.join("\n");

}


/* =====================================================
   選択状態表示
===================================================== */

function update(){

const text =
makeKubunText();

if(text){

selElement.textContent =
"選択中：\n" + text;

}else{

selElement.textContent =
"未選択";

}

}


/* =====================================================
   すべて選択
===================================================== */

function allOn(){

catsElement
.querySelectorAll(
'input[type="checkbox"]'
)
.forEach(function(x){

x.checked =
true;

});

update();

}


/* =====================================================
   選択解除
===================================================== */

function allOff(){

catsElement
.querySelectorAll(
'input[type="checkbox"]'
)
.forEach(function(x){

x.checked =
false;

});

update();

}


/* =====================================================
   AI処理ルール
===================================================== */

const RULE = `【支援経過作成ルール】

【区分】

入力した区分と同一語句を使用する。

「自宅訪問」を選択した場合は、区分欄を必ず以下の3行で記載する。

自宅訪問
本人
家族

その他の選択区分は、それぞれ1行ずつ記載する。

区分の各行の先頭には「・」を付けない。

複数選択された場合は、選択されたすべての区分を記載する。


【内容】

「区分：」という文字は内容欄には絶対に記載しない。

「自宅訪問」を選択した場合、自宅訪問という見出しは内容欄には記載しない。

自宅訪問について入力された音声・手入力の内容を、内容欄の冒頭に自然な支援経過記録として記載する。

自宅訪問以外の区分については、定型文に指定された【】付きの見出しを使用し、その直下に定型文を記載する。

定型文があるものは原則としてそのまま使用する。

項目と項目の間に空行を入れない。

連絡調整は、音声・手入力された内容をもとに自由記載として整理する。

入力された訪問時の状況、本人・家族の発言、生活状況、サービス利用状況、連絡内容などを事実ベースで記載する。

報告書のような硬い表現にはしない。

入力されていない内容を推測して追加しない。

感情や印象を勝手に補足しない。


【関係機関・介護支援専門員の判断】

入力された情報をもとに、ケアマネジャーとして行ったことや判断を記載する。

「〇〇した。〇〇する。」のような自然な記録表現とする。

「確認した」という表現だけで終わらせない。

内容欄と重複する事項は判断欄には記載しない。

短期目標更新については、内容欄には記載せず、この判断欄にのみ記載する。

ケアマネジャーとして必要な支援方針、サービス調整、今後の対応等を記載する。


【利用者・家族の考え方】

本人の意見は、

本人：

家族の意見は、

家族：

として記載する。

本人・家族の発言が入力されている場合は、その内容を自然な話し言葉としてまとめる。

「と話す」
「とのこと」
「との話あり」
「と言われる」

などの報告調・記録調の表現は禁止する。

例：

本人：今のサービスを続けたい。

家族：今まで通り利用してもらえると助かる。

意見が入力されていない場合は、無理に作成しない。


【出力形式】

区分：
自宅訪問
本人
家族
サービス担当者会議
サービス利用割合の説明

内容：
【ここから内容を記載】

関係機関・介護支援専門員の判断：
【ここから判断を記載】

利用者・家族の考え方：
本人：
家族：`;


/* =====================================================
   AI処理用コピー
===================================================== */

function copyAI(){

const a =
selected();

const m =
memoElement.value.trim();


if(!a.length){

csElement.textContent =
"区分を選択してください。";

return;

}


if(!m){

csElement.textContent =
"音声・手入力の内容を入力してください。";

return;

}


/* -----------------------------------------------------
   AIへ渡す定型文
----------------------------------------------------- */

const templates =
a.map(function(x){

if(x === "自宅訪問"){

return "【自宅訪問】は見出しとして使用しない。自宅訪問の内容は音声・手入力記録をもとに内容欄へ直接記載する。";

}

if(x === "短期目標更新"){

return "短期目標更新は内容欄には記載せず、関係機関・介護支援専門員の判断欄にのみ反映する。";

}

if(x === "連絡調整"){

return "連絡調整は定型文を使用せず、音声・手入力記録をもとに自由記載する。";

}

return T[x];

}).filter(function(x){

return x;

}).join("\n");


/* -----------------------------------------------------
   AIへ渡す全文
----------------------------------------------------- */

const text =
`あなたは経験豊富な介護支援専門員です。
以下の情報から、介護支援専門員の支援経過記録を作成してください。

【選択区分】
${makeKubunText()}

【選択された区分】
${a.join("、")}

【定型文・区分別ルール】
${templates}

【音声・手入力記録】
${m}

${RULE}

【最重要】

1．区分欄には「区分：」の次の行から区分を1行ずつ記載してください。
2．区分欄には「・」を付けないでください。
3．自宅訪問を選択した場合は、
自宅訪問
本人
家族
の3行を記載してください。
4．内容欄には「区分：」を絶対に記載しないでください。
5．内容欄では「自宅訪問」という見出しを記載しないでください。
6．自宅訪問の音声・手入力内容は、内容欄の最初に直接記載してください。
7．その他の定型文は【利用票交付】などの見出しを付け、その直下に定型文を記載してください。
8．項目と項目の間に空行を入れないでください。
9．選択されたすべての区分を反映してください。
10．入力されていない事実を推測して追加しないでください。
11．短期目標更新は内容欄には記載せず、関係機関・介護支援専門員の判断欄にのみ記載してください。
12．利用者・家族の考え方は、入力された発言をもとに自然な話し言葉で記載してください。

以下の4項目だけを出力してください。

区分：
内容：
関係機関・介護支援専門員の判断：
利用者・家族の考え方：`;


copyText(
text,
csElement,
"AI処理用データをコピーしました。ChatGPT・Gemini・Claude等へ貼り付けてください。"
);

}


/* =====================================================
   コピー処理
===================================================== */

function copyText(
text,
element,
successMessage
){

if(
navigator.clipboard &&
window.isSecureContext
){

navigator.clipboard.writeText(text)
.then(function(){

element.textContent =
successMessage;

})
.catch(function(){

fallbackCopy(
text,
element,
successMessage
);

});

}else{

fallbackCopy(
text,
element,
successMessage
);

}

}


/* =====================================================
   古いブラウザ用コピー
===================================================== */

function fallbackCopy(
text,
element,
successMessage
){

const temporary =
document.createElement("textarea");

temporary.value =
text;

temporary.style.position =
"fixed";

temporary.style.left =
"-9999px";

document.body.appendChild(
temporary
);

temporary.focus();

temporary.select();

try{

const success =
document.execCommand("copy");

if(success){

element.textContent =
successMessage;

}else{

element.textContent =
"コピーできませんでした。手動でコピーしてください。";

}

}catch(error){

element.textContent =
"コピーできませんでした。手動でコピーしてください。";

}

document.body.removeChild(
temporary
);

}


/* =====================================================
   初期表示
===================================================== */

update();

</script>

</body>
</html>
