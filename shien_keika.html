<html lang="ja">
<head>

<title>BlueOcean 支援経過</title>

<style>

body{
  margin:0;
  background:#f4f7fb;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;
}

header{
  background:#0b5cab;
  color:white;
  padding:16px;
}

main{
  max-width:900px;
  margin:auto;
  padding:12px;
}

.card{
  background:white;
  padding:15px;
  margin:12px 0;
  border-radius:14px;
  box-shadow:0 2px 8px #0001;
}

h1{
  font-size:21px;
  margin:0;
}

h2{
  font-size:18px;
  margin-top:0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

label{
  border:1px solid #ccd5df;
  border-radius:9px;
  padding:10px;
  display:flex;
  gap:8px;
  align-items:center;
  background:white;
  cursor:pointer;
}

label:hover{
  background:#f1f6ff;
}

input[type=checkbox]{
  width:20px;
  height:20px;
  flex-shrink:0;
}

textarea{
  width:100%;
  box-sizing:border-box;
  border:1px solid #ccd5df;
  border-radius:9px;
  padding:11px;
  font-size:16px;
  line-height:1.6;
  min-height:220px;
  resize:vertical;
}

button{
  border:0;
  border-radius:9px;
  background:#0b5cab;
  color:white;
  padding:12px 15px;
  font-size:15px;
  margin:4px 2px;
  cursor:pointer;
}

button:hover{
  opacity:0.9;
}

.gray{
  background:#64748b;
}

.status{
  background:#eef4ff;
  padding:9px;
  border-radius:8px;
  font-size:13px;
  margin-top:7px;
  white-space:pre-wrap;
}

.description{
  font-size:14px;
  line-height:1.6;
  color:#444;
}

@media(max-width:600px){

  .grid{
    grid-template-columns:1fr;
  }

  button{
    width:100%;
    margin:4px 0;
  }

}

</style>
</head>


<body>

<header>

<h1>BlueOcean　支援経過</h1>

<div>
区分を選択 → 音声・手入力 → AI処理用にコピー
</div>

</header>


<main>


<!-- =====================================================
     ① 区分を選択
===================================================== -->

<section class="card">

<h2>① 区分を選択</h2>

<div id="cats" class="grid"></div>

<button class="gray" onclick="allOn()">
すべて選択
</button>

<button class="gray" onclick="allOff()">
選択解除
</button>

<div id="sel" class="status">
未選択
</div>

</section>


<!-- =====================================================
     ② 音声・手入力
===================================================== -->

<section class="card">

<h2>② 音声・手入力</h2>

<p class="description">

訪問時の状況、本人・家族の発言、生活状況、
サービス利用状況、連絡内容などを入力してください。

<br>

<strong>
Windowsの場合は「Windowsキー＋H」で音声入力できます。
</strong>

</p>

<textarea
id="memo"
placeholder="ここに話した内容や支援経過に残したい内容を入力してください。"
></textarea>

</section>


<!-- =====================================================
     ③ AI処理用にコピー
===================================================== -->

<section class="card">

<h2>③ AI処理用にコピー</h2>

<p class="description">

「AI処理用にコピー」を押して、ChatGPT・Gemini・Claudeなど、
利用するAIへ貼り付けてください。

</p>

<button onclick="copyAI()">
AI処理用にコピー
</button>

<div id="cs" class="status">
未コピー
</div>

</section>


</main>

/* =====================================================
   区分を画面に表示
===================================================== */

Object.keys(T).forEach(function(key){

  const label =
  document.createElement("label");

  const checkbox =
  document.createElement("input");

  checkbox.type =
  "checkbox";

  checkbox.value =
  key;

  checkbox.addEventListener(
    "change",
    update
  );

  label.appendChild(
    checkbox
  );

  label.appendChild(
    document.createTextNode(key)
  );

  catsElement.appendChild(
    label
  );

});


/* =====================================================
   選択区分を取得
===================================================== */

function selected(){

  return Array.from(
    catsElement.querySelectorAll(
      'input[type="checkbox"]:checked'
    )
  ).map(function(x){

    return x.value;

  });

}


/* =====================================================
   区分欄の表示
===================================================== */

function update(){

  const a =
  selected();

  if(!a.length){

    selElement.textContent =
    "未選択";

    return;

  }

  let output = [];

  a.forEach(function(item){

    if(item === "自宅訪問"){

      output.push("自宅訪問");
      output.push("本人");
      output.push("家族");

    }else{

      output.push(item);

    }

  });

  selElement.textContent =
  output.join("\n");

}


/* =====================================================
   すべて選択
===================================================== */

function allOn(){

  catsElement
  .querySelectorAll(
    'input[type="checkbox"]'
  )
  .forEach(function(x){

    x.checked =
    true;

  });

  update();

}


/* =====================================================
   選択解除
===================================================== */

function allOff(){

  catsElement
  .querySelectorAll(
    'input[type="checkbox"]'
  )
  .forEach(function(x){

    x.checked =
    false;

  });

  update();

}

複数選択された場合は、すべて記載する。

--------------------------------------------------

【サービス利用割合の説明】
居宅介護支援のサービス利用割合について説明。

連絡調整：

連絡調整を選択した場合は、入力された連絡・調整内容を簡潔に整理して記載する。

新規依頼・契約：

新規依頼情報提供実施。

--------------------------------------------------

【④関係機関・介護支援専門員の判断】

入力された情報をもとに、ケアマネジャーとして行ったこと・判断を記載する。

「〇〇した。〇〇する。」のような自然な文章にする。

「〇〇を確認した」という表現を多用しない。

本人・家族からの相談や発言は「内容」に記載する。

介護支援専門員やサービス事業所等からの相談・判断・調整については「関係機関・介護支援専門員の判断」に記載する。

内容と重複する事項は判断欄には記載しない。

内容に記載した事項を優先する。

短期目標更新を選択した場合は、短期目標更新に関する判断をこの欄に必ず記載する。

ただし、短期目標更新の定型文そのものは「内容」に必ず記載する。

--------------------------------------------------

【⑤利用者・家族の考え方】

本人・家族の発言が入力されている場合のみ記載する。

本人：
本人の話し言葉として自然にまとめる。

家族：
家族の話し言葉として自然にまとめる。

「〜と話す」
「〜とのこと」
「〜との話あり」
「〜と言われる」
「〜との様子」

などの報告調・記録調の表現は禁止。

必ず本人・家族がその場で話したような自然な表現にする。

例：

本人：今までと同じようにサービスを利用したい。

家族：今のサービスを続けてもらえると助かります。

意見がない場合は空欄にする。

--------------------------------------------------

【⑥出力形式】

必ず以下の4項目のみ出力する。

区分：
内容：
関係機関・介護支援専門員の判断：
利用者・家族の考え方：

ただし「区分：」という見出しの後は、各区分を1行ずつ記載する。

区分の各行頭には「・」を付けない。

自宅訪問の場合は、

自宅訪問
本人
家族

と3行で記載する。

その他の選択区分は、選択した語句をそのまま1行ずつ記載する。

内容の中には「区分：」を絶対に入れない。

選択された区分の定型文は必ずすべて内容に反映する。

定型文と定型文の間に空行を入れない。

--------------------------------------------------

【⑦最重要】

選択された区分を1つも欠落させない。

特に以下を選択した場合は必ず反映する。

利用票交付
モニタリング
アセスメント
サービス担当者会議
長期目標更新
短期目標更新

退院・退所加算（面談・サマリーあり）
退院・退所加算（面談・サマリーなし）
退院・退所加算（会議開催・カンファなし）
退院・退所加算（カンファレンス開催）
カンファレンス
サービス利用割合の説明

選択された区分は「区分」に必ず記載し、
対応する定型文は「内容」に必ず記載する。

短期目標更新を選択した場合も、
「短期目標更新」を区分に記載し、

さらに必要な判断を「関係機関・介護支援専門員の判断」に記載する。

内容には「自宅訪問」という見出しを付けない。

/* =====================================================
   コピー処理
===================================================== */

function copyText(
  text,
  element,
  successMessage
){

  if(
    navigator.clipboard &&
    window.isSecureContext
  ){

    navigator.clipboard.writeText(text)

    .then(function(){

      element.textContent =
      successMessage;

    })

    .catch(function(){

      fallbackCopy(
        text,
        element,
        successMessage
      );

    });

  }else{

    fallbackCopy(
      text,
      element,
      successMessage
    );

  }

}


/* =====================================================
   古いブラウザ・iPhone等用コピー
===================================================== */

function fallbackCopy(
  text,
  element,
  successMessage
){

  const temporary =
  document.createElement("textarea");

  temporary.value =
  text;

  temporary.style.position =
  "fixed";

  temporary.style.left =
  "-9999px";

  temporary.style.top =
  "0";

  document.body.appendChild(
    temporary
  );

  temporary.focus();

  temporary.select();

  try{

    const success =
    document.execCommand("copy");

    if(success){

      element.textContent =
      successMessage;

    }else{

      element.textContent =
      "コピーできませんでした。手動でコピーしてください。";

    }

  }catch(error){

    element.textContent =
    "コピーできませんでした。手動でコピーしてください。";

  }

  document.body.removeChild(
    temporary
  );

}
